{% extends 'website/base.html' %}

{% block title %}Recuperar senha | SobraNada{% endblock %}

{% block content %}
<section class="section">
    <div class="container auth-box">
        <h1>Recuperar senha</h1>
        <p>Digite seu email e enviaremos um link para redefinir a senha.</p>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn" type="submit">Enviar link</button>
        </form>

        <p class="auth-links">
            <a class="text-link" href="{% url 'login' %}">Voltar para login</a>
        </p>
    </div>
</section>
{% endblock %}
