{% extends "website/modelo2.html" %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'cidade-list' %}">Cidades</a></li>
<li class="breadcrumb-item active">Detalhes</li>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-gradient-primary text-white py-3">
        <h4 class="mb-0 fs-5">Detalhes da Cidade</h4>
      </div>
      <div class="card-body p-4">
        <p><strong>ID:</strong> #{{ object.pk }}</p>
        <p><strong>Nome:</strong> {{ object.name }}</p>
        <p><strong>Estado:</strong> {{ object.estado }}</p>
      </div>
      <div class="card-footer bg-light p-3 d-flex gap-2">
        <a href="{% url 'cidade-update' object.pk %}" class="btn btn-primary"><i class="bi bi-pencil me-2"></i>Editar</a>
        <a href="#" class="btn btn-outline-secondary" onclick="window.history.back()"><i class="bi bi-arrow-left me-2"></i>Voltar</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
