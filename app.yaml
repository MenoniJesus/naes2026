runtime: python312
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 --timeout 120 DjangoProject.wsgi

# As variáveis abaixo têm prioridade sobre o .env (load_dotenv não sobrescreve o ambiente).
# Os segredos (SECRET_KEY, DATABASE_URL, ANTHROPIC_API_KEY) continuam vindo do .env enviado no deploy.
env_variables:
  DEBUG: "False"

handlers:

- url: /static
  static_dir: static_gcloud/
  secure: always
- url: /.*
  script: auto
  secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2
